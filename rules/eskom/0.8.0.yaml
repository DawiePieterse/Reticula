    HARE:       { mass_kg_per_km: 425,  diameter_mm: 14.16, area_mm2: 122.5, breaking_load_kn: 32.7, modulus_gpa: 79, expansion_per_c: 0.0000191 }
    WOLF:       { mass_kg_per_km: 727,  diameter_mm: 18.13, area_mm2: 194.9, breaking_load_kn: 69.2, modulus_gpa: 75, expansion_per_c: 0.0000178 }
    PANTHER:    { mass_kg_per_km: 976,  diameter_mm: 21.0,  area_mm2: 261.5, breaking_load_kn: 89.7, modulus_gpa: 75, expansion_per_c: 0.0000178 }

# Underground cables (plan 2.6). The standard installation conditions and the pipe rule are from 240-56030637 Rev 2
# (held). The de-rating factors are placeholders: the grouping factors are in that document's de-rating annex (to
# transcribe), and the soil, depth and temperature factors come from SANS 10198-4, which it cites and which is not held.
underground:
  clause: "240-56030637 Rev 2 §3.9.1 o)–p) (standard conditions), §3.9.6 i) (pipes), de-rating annex; SANS 10198-4 factors not held"
  index: ESKOM-DERATE
  standard: { soil_resistivity_kmw: 1.2, depth_m: 0.5, ground_temp_c: 25 }   # 240-56030637 §3.9.1 o)
  design:   { soil_resistivity_kmw: 1.2, depth_m: 0.6, ground_temp_c: 25 }   # PLACEHOLDER: the site's conditions
  factors:
    soil_resistivity: [[0.7, 1.15], [1.0, 1.07], [1.2, 1.0], [1.5, 0.92], [2.0, 0.82], [2.5, 0.75], [3.0, 0.69]]   # PLACEHOLDER
    depth: [[0.5, 1.0], [0.6, 0.98], [0.8, 0.96], [1.0, 0.94], [1.25, 0.92], [1.5, 0.91]]                         # PLACEHOLDER
    ground_temp: [[10, 1.11], [15, 1.07], [20, 1.04], [25, 1.0], [30, 0.96], [35, 0.92], [40, 0.88]]               # PLACEHOLDER
    grouping: [[1, 1.0], [2, 0.81], [3, 0.70], [4, 0.65], [5, 0.60], [6, 0.57]]                                    # PLACEHOLDER
  pipe_threshold_pct: 10      # 240-56030637 §3.9.6 i): the pipe rating applies where more than 10 % of the length is in pipe
  pipe_share_pct: 5           # PLACEHOLDER: share of each feeder in pipe at road crossings
  trench_shared_m: 30         # PLACEHOLDER: feeders leaving a mini-sub share its trench this far
  default_conductor: AL-4C-70
  kiosk:
    boxes: 3                  # one group of MCBs per phase, kiosk balanced across phases (240-56030637 §3.10 e))
    box_loads: 4              # at most 4 MCBs per phase (240-56030637 §3.5.3 d)–f), ESKOM-KIOSK)
    spacing_m: 70             # PLACEHOLDER: kiosks along each underground route
    max_service_m: 35         # PLACEHOLDER

# Transformers (plans 3.1, 3.2). Ratings: SANS 780 preferred series. Which ratings are pole-mounted and which are
# mini-subs, the impedances, X/R and losses are placeholders until Eskom 240-56062752 and SANS 780 are held.
transformers:
  clause: "Transformer sizing and selection: SANS 780 preferred ratings; mounting, impedance and losses placeholders (240-56062752 not held)"
  index: ESKOM-MINISUB
  ratings_kva: [16, 25, 50, 100, 200, 315, 500, 1000]
  pole_mount_ratings_kva: [16, 25, 50, 100, 200]   # PLACEHOLDER
  minisub_ratings_kva: [200, 315, 500, 1000]       # PLACEHOLDER
  growth_pct: 10              # PLACEHOLDER: the design demand is at most rating × (1 − growth)
  max_loading_pct: 100
  impedance_pct: { "16": 4.0, "25": 4.0, "50": 4.0, "100": 4.0, "200": 4.0, "315": 4.5, "500": 4.5, "1000": 5.0 }   # PLACEHOLDER
  x_over_r:      { "16": 1.0, "25": 1.2, "50": 1.5, "100": 2.0, "200": 2.5, "315": 3.0, "500": 3.5, "1000": 5.0 }   # PLACEHOLDER
  no_load_loss_w: { "16": 80, "25": 105, "50": 160, "100": 260, "200": 400, "315": 570, "500": 790, "1000": 1300 }   # PLACEHOLDER
  load_loss_w:    { "16": 400, "25": 600, "50": 1000, "100": 1750, "200": 2900, "315": 3900, "500": 5700, "1000": 10500 }   # PLACEHOLDER
  taps_pct: [-5, -2.5, 0, 2.5, 5]   # PLACEHOLDER: off-load tap positions, boost positive
  underground_minisub: true

# MV network from the marked MV routes (plans 3.3, 3.4). The joining tolerances are Reticula's drawing tolerances.
mv_network:
  clause: "Reticula MV network drawing tolerances and MV design defaults (not a standard; conductor and power factor placeholders)"
  index: RETICULA-MVMODEL
  join_m: 3
  near_miss_m: 10
  source_reach_m: 150         # the connection point to the nearest MV route
  tap_reach_m: 60             # a transformer to the nearest MV route, by a tee-off
  default_conductor: FOX      # PLACEHOLDER
  default_cable: MV-AL-3C-70  # PLACEHOLDER
  power_factor: 0.95          # PLACEHOLDER

