# Eskom residential distribution rules: 0.7.0 plus the design settings for Phases 2.5 to 5.
# Only the keys below differ from the base file. Every value must be checked before use in a design.
base: eskom/0.7.0
authority: eskom
version: 0.8.0
effective_date: 2026-10-06
notes: >-
  As 0.7.0, plus the settings a full design run needs: overhead line design (spans, sag and tension, clearance, pole
  class, stays), underground de-rating and kiosks, transformer sizing and selection, the MV network and its
  conductors, bulk supply and the fault study, and the default economic assumptions for lifetime cost. The Eskom
  overhead line standard (ESKOM-OHL), the mini-substation standard 240-56062752, the voltage standard 240-70465489 and
  SANS 10198-4 are not held, so almost every value here is a placeholder; the exceptions name the held clause they come
  from. Not for design use until checked.

standards:
  NRS034-1: "2024"      # TODO confirm edition
  NRS048-2: "2024"      # TODO confirm edition
  SANS1507: "2024"      # TODO confirm edition
  IEC60909: "2016"      # TODO confirm edition
  ESKOM240-56030637: "Rev 2 (2021)"
  ESKOM240-87658920: "Rev 1 (2009)"

voltage:
  mv_max_drop_pct: 5          # PLACEHOLDER: MV drop from the connection point to a transformer (NRS 048-2 / 240-70465489 not held)
  lv_max_rise_pct: 10         # PLACEHOLDER: LV voltage above nominal at light load, limits the tap boost

construction:
  clause: "Construction allowed for Eskom residential electrification: overhead ABC or underground cable (to confirm with the planning standard)"
  index: ESKOM-PLANNING
  allowed: [overhead, underground]
  default: overhead

# Overhead line design (plan 2.5). Poles go at every route node and every route vertex that turns the line by more
# than min_deviation_deg, then between them so that no span exceeds max_span_m. Sag and tension use the parabolic
# state-change equation over each strain section's ruling span. Every number is a placeholder: ESKOM-OHL not held.
overhead:
  clause: "Overhead line design settings: Eskom overhead line standard not identified (ESKOM-OHL); all values placeholders"
  index: ESKOM-OHL
  min_deviation_deg: 3
  stay_angle_deg: 10          # PLACEHOLDER: poles turning the line more than this are stayed
  stay_slope_deg: 45          # PLACEHOLDER: angle between stay wire and pole
  states:
    everyday_temp_c: 15       # PLACEHOLDER
    max_temp_c: 75            # PLACEHOLDER: conductor temperature for the largest sag
    min_temp_c: -5            # PLACEHOLDER
    wind_pressure_pa: 500     # PLACEHOLDER: wind on the conductor with the minimum temperature
  lv:
    max_span_m: 40            # PLACEHOLDER
    min_span_m: 8
    pole_heights_m: [7, 9]    # kicker and LV poles 5, 7 and 9 m appear in 240-87658920 Annex B; 7 and 9 m used here
    attachment_below_top_m: 0.3
    setting_depth_fraction: 0.1   # PLACEHOLDER: setting depth = 0.1 × length + 0.6 m (rule of thumb)
    setting_depth_fixed_m: 0.6
    min_ground_clearance_m: 5.5   # PLACEHOLDER
    everyday_tension_pct: 15      # PLACEHOLDER: % of the supporting conductor's breaking load
    max_tension_pct: 50           # PLACEHOLDER
  mv:
    max_span_m: 90            # PLACEHOLDER
    min_span_m: 15
    pole_heights_m: [11, 12, 13]  # PLACEHOLDER
    attachment_below_top_m: 0.6
    setting_depth_fraction: 0.1
    setting_depth_fixed_m: 0.6
    min_ground_clearance_m: 6.5   # PLACEHOLDER
    everyday_tension_pct: 18      # PLACEHOLDER
    max_tension_pct: 50           # PLACEHOLDER
    default_conductor: FOX
  pole_classes:               # PLACEHOLDER: working tip load by class (wood pole standard not held)
    - { class: "1", tip_load_kn: 2.0 }
    - { class: "2", tip_load_kn: 3.5 }
    - { class: "3", tip_load_kn: 5.0 }
    - { class: "4", tip_load_kn: 7.5 }
    - { class: "5", tip_load_kn: 10.0 }
  # PLACEHOLDER: mechanical data. ABC tension is carried by the supporting neutral, taken here as the phase size.
  # ACSR and AAAC values are typical published values for the named conductors, to confirm against the supplier.
  mechanical:
    ABC-3C-25:  { mass_kg_per_km: 400,  diameter_mm: 25, area_mm2: 25,  breaking_load_kn: 7.0,  modulus_gpa: 56, expansion_per_c: 0.000023 }
    ABC-3C-35:  { mass_kg_per_km: 520,  diameter_mm: 28, area_mm2: 35,  breaking_load_kn: 10.0, modulus_gpa: 56, expansion_per_c: 0.000023 }
    ABC-3C-50:  { mass_kg_per_km: 690,  diameter_mm: 32, area_mm2: 50,  breaking_load_kn: 14.0, modulus_gpa: 56, expansion_per_c: 0.000023 }
    ABC-3C-70:  { mass_kg_per_km: 940,  diameter_mm: 36, area_mm2: 70,  breaking_load_kn: 20.0, modulus_gpa: 56, expansion_per_c: 0.000023 }
    ABC-3C-95:  { mass_kg_per_km: 1250, diameter_mm: 41, area_mm2: 95,  breaking_load_kn: 27.0, modulus_gpa: 56, expansion_per_c: 0.000023 }
    ABC-3C-120: { mass_kg_per_km: 1550, diameter_mm: 45, area_mm2: 120, breaking_load_kn: 34.0, modulus_gpa: 56, expansion_per_c: 0.000023 }
    ABC-3C-150: { mass_kg_per_km: 1900, diameter_mm: 50, area_mm2: 150, breaking_load_kn: 42.0, modulus_gpa: 56, expansion_per_c: 0.000023 }
    ABC-1C-16:  { mass_kg_per_km: 140,  diameter_mm: 15, area_mm2: 16,  breaking_load_kn: 4.4,  modulus_gpa: 56, expansion_per_c: 0.000023 }
    ABC-1C-25:  { mass_kg_per_km: 210,  diameter_mm: 18, area_mm2: 25,  breaking_load_kn: 7.0,  modulus_gpa: 56, expansion_per_c: 0.000023 }
    ABC-1C-35:  { mass_kg_per_km: 280,  diameter_mm: 20, area_mm2: 35,  breaking_load_kn: 10.0, modulus_gpa: 56, expansion_per_c: 0.000023 }
    ABC-1C-50:  { mass_kg_per_km: 380,  diameter_mm: 23, area_mm2: 50,  breaking_load_kn: 14.0, modulus_gpa: 56, expansion_per_c: 0.000023 }
    ABC-1C-70:  { mass_kg_per_km: 520,  diameter_mm: 26, area_mm2: 70,  breaking_load_kn: 20.0, modulus_gpa: 56, expansion_per_c: 0.000023 }
    ABC-1C-95:  { mass_kg_per_km: 700,  diameter_mm: 30, area_mm2: 95,  breaking_load_kn: 27.0, modulus_gpa: 56, expansion_per_c: 0.000023 }
    ABC-1C-120: { mass_kg_per_km: 870,  diameter_mm: 33, area_mm2: 120, breaking_load_kn: 34.0, modulus_gpa: 56, expansion_per_c: 0.000023 }
    ABC-1C-150: { mass_kg_per_km: 1060, diameter_mm: 36, area_mm2: 150, breaking_load_kn: 42.0, modulus_gpa: 56, expansion_per_c: 0.000023 }
    SQUIRREL:   { mass_kg_per_km: 85,   diameter_mm: 6.33,  area_mm2: 24.5,  breaking_load_kn: 7.6,  modulus_gpa: 79, expansion_per_c: 0.0000191 }
    GOPHER:     { mass_kg_per_km: 106,  diameter_mm: 7.08,  area_mm2: 30.6,  breaking_load_kn: 9.6,  modulus_gpa: 79, expansion_per_c: 0.0000191 }
    FOX:        { mass_kg_per_km: 149,  diameter_mm: 8.37,  area_mm2: 42.8,  breaking_load_kn: 13.0, modulus_gpa: 79, expansion_per_c: 0.0000191 }
    RABBIT:     { mass_kg_per_km: 214,  diameter_mm: 10.05, area_mm2: 61.7,  breaking_load_kn: 18.4, modulus_gpa: 79, expansion_per_c: 0.0000191 }
    MINK:       { mass_kg_per_km: 256,  diameter_mm: 10.98, area_mm2: 73.6,  breaking_load_kn: 21.3, modulus_gpa: 79, expansion_per_c: 0.0000191 }
