# Bulk supply, load flow and fault study (Phase 4). The voltage factors are IEC 60909-0 Table 1 (edition not held, to
# confirm); the rest are placeholders.
bulk:
  clause: "Bulk supply: IEC 60909-0 Table 1 voltage factors (to confirm); supply steps, switchgear rating and clearing times placeholders"
  index: ESKOM-SUPPLY
  supply_steps_kva: [100, 200, 315, 500, 750, 1000, 1500, 2000, 3000, 5000]   # PLACEHOLDER: notified maximum demand steps
  c_max_mv: 1.10              # IEC 60909-0 Table 1 (to confirm)
  c_min_mv: 1.00              # IEC 60909-0 Table 1 (to confirm)
  c_max_lv: 1.05              # IEC 60909-0 Table 1, systems with +6 % tolerance (to confirm)
  c_min_lv: 0.95              # IEC 60909-0 Table 1 (to confirm)
  mv_switchgear_ka: 20        # PLACEHOLDER: MV switchgear short-time rating
  lv_clearing_s: 0.4          # PLACEHOLDER: LV fault clearing time for cable withstand (240-57649065 not held)
  mv_clearing_s: 1.0          # PLACEHOLDER
  transformer_vector_group: Dyn11
  zero_sequence:              # PLACEHOLDER: zero-sequence impedance as a multiple of the positive sequence
    lv: { r0_ratio: 4.0, x0_ratio: 3.0 }
    mv_overhead: { r0_ratio: 3.0, x0_ratio: 3.5 }
    mv_cable: { r0_ratio: 1.5, x0_ratio: 1.0 }

# Default economic assumptions (Phase 5.1). These are Reticula defaults, not an authority's rules: a design run may
# set its own, and the run records which it used.
economics:
  clause: "Reticula default economic assumptions for lifetime cost (not a standard); set per design run"
  index: RETICULA-ECON
  period_years: 25
  discount_rate_pct: 8
  energy_cost_zar_per_kwh: 1.5
  load_growth_pct: 1.5
  loss_load_factor: 0.25
  rate_uncertainty_pct: 15
