# Eskom residential distribution rules: 0.4.0 plus the LV conductor library (Phase 2.3).
# Only the keys below differ from the base file. Every value must be checked before use in a design.
base: eskom/0.4.0
authority: eskom
version: 0.5.0
effective_date: 2026-10-05
notes: >-
  As 0.4.0, with the conductor library replaced. Underground cable current ratings and short-circuit constants are
  transcribed from Eskom 240-56030637 Rev 2 (LV cable systems), Tables 6 and 7 and §3.9.1 m); the engineer confirmed
  Rev 2 is current. Resistances and reactances are placeholders until the Eskom cable specification 240-56063805 is
  held. Single-phase ABC (one phase and an insulated neutral, 25 to 150 mm²) comes from a manufacturer's data sheet
  for a SANS 1418 product (CBi-electric african cables, February 2026), to confirm against the Eskom ABC
  specification 240-84758170; the three-phase ABC-70 entry stays a placeholder until that specification is held.
  Each conductor lists its placeholder fields under `placeholder`.

standards:
  NRS034-1: "2024"      # TODO confirm edition
  NRS048-2: "2024"      # TODO confirm edition
  SANS1507: "2024"      # TODO confirm edition
  IEC60909: "2016"      # TODO confirm edition
  ESKOM240-56030637: "Rev 2 (2021)"

# Conductors and cables. rating_a is the rating as normally installed: in ground for underground cables (standard
# conditions of 240-56030637 §3.9.1 o): 70 °C conductor, 25 °C soil, 30 °C air, 1,2 K·m/W, 0,5 m deep, load factor 1,
# thermally independent). ratings_a gives the rating in ground, in pipes and in air. fault_k is K in I = K·A/√t, kA.
# Feeder cables are four-core; services two-core (single phase) or four-core (three phase) (§3.9.1 i)–j)).
# r_ohm_per_km is DC at 20 °C; r_ac_ohm_per_km, where given, is AC at r_ac_temp_c (the conductor's operating temperature).
