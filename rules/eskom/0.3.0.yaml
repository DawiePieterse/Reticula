# Eskom residential distribution rules – LV design (plan Phase 2). STARTER VALUES.
# Inherits load data, income/ADMD and building prediction from eskom/0.2.0.
# Every value below marked `status: unverified` is a typical published/manufacturer figure, transcribed so the design
# engine can run. Each must be checked against the authority's current standard (see docs/standards-index.md)
# before a design is submitted. The calc service reports any unverified value a design used.
base: eskom/0.2.0
authority: eskom
version: 0.3.0
effective_date: 2026-10-04
notes: >-
  Adds the LV design section (Herman-Beta voltage drop, phase rotation, limits), an LV conductor and cable library,
  overhead span/sag/pole rules, underground derating factors and LV fault level rules. Values are typical figures
  pending verification against NRS 034-1, NRS 048-2, SANS 1418, SANS 1507, SANS 10198, SANS 10280 and SANS 754.

standards:
  NRS034-1: "2024"      # TODO confirm edition
  NRS048-2: "2024"      # TODO confirm edition
  SANS1418-1: "2024"    # TODO confirm edition
  SANS1507-4: "2024"    # TODO confirm edition
  SANS10198-4: "2024"   # TODO confirm edition
  SANS10280-1: "2024"   # TODO confirm edition
  SANS754: "2024"       # TODO confirm edition
  IEC60909-0: "2016"    # TODO confirm edition

voltage:
  lv_nominal_v: 400
  lv_max_drop_pct: 8.0   # feeder + service, transformer LV terminals to point of supply; TODO NRS 034-1 / NRS 048-2
  mv_nominal_kv: 11
  clause: "NRS048-2 §4 (supply voltage), NRS034-1 voltage-drop allocation; idx V-01"

lv_design:
  clause: "NRS034-1 §(Herman-Beta voltage drop); idx LV-01"
  phase_voltage_v: 230
  power_factor: 0.95
  confidence_pct: 90
  feeder_max_drop_pct: 7.0     # TODO confirm allocation
  service_max_drop_pct: 1.0    # TODO confirm allocation
  # ReticMaster's paired rotation (engineer decision 2026-10-04): W W R R B B, repeating along the feeder.
  phase_rotation: [W, W, R, R, B, B]
  # Herman-Beta: a 3-phase domestic connection counts as one consumer on each phase.
  three_phase_counts_per_phase: true
  max_service_length_m: 35
  service_conductor: SC-10CU
  service_conductors: [SC-10CU, SC-16CU, SC-25CU]   # sizing moves a service up this list when its drop is too high
  feeder_conductors:
    overhead: [ABC-35, ABC-50, ABC-70, ABC-95]
    underground: [CU-PVC-16, CU-PVC-25, CU-PVC-35, CU-PVC-50, CU-PVC-70, CU-PVC-95, CU-PVC-120, CU-PVC-150, CU-PVC-185]
  status: unverified

# R and X are AC values at maximum operating temperature; neutral values are for the 4th core or neutral messenger.
# k is the adiabatic short-circuit constant (A·s^0.5/mm²). Ratings: ABC in free air (40 °C ambient);
# cables direct in ground at 0.8 m, 1.2 K·m/W, 25 °C, single circuit (derated by the underground section).
conductors:
  - { code: ABC-35, description: "4 x 35 mm² Al ABC (SANS 1418)", kind: overhead, role: feeder, material: Al, area_mm2: 35, r_ohm_per_km: 1.08, x_ohm_per_km: 0.087, neutral_r_ohm_per_km: 1.08, rating_a: 120, k: 94, fuse_a: 100, mass_kg_per_m: 0.55, diameter_mm: 28, uts_kn: 19.6, e_gpa: 56, alpha_per_c: 2.3e-5, clause: "SANS1418-1; idx C-01", status: unverified }
  - { code: ABC-50, description: "4 x 50 mm² Al ABC (SANS 1418)", kind: overhead, role: feeder, material: Al, area_mm2: 50, r_ohm_per_km: 0.80, x_ohm_per_km: 0.085, neutral_r_ohm_per_km: 0.80, rating_a: 145, k: 94, fuse_a: 125, mass_kg_per_m: 0.75, diameter_mm: 31, uts_kn: 28.0, e_gpa: 56, alpha_per_c: 2.3e-5, clause: "SANS1418-1; idx C-01", status: unverified }
  - { code: ABC-70, description: "4 x 70 mm² Al ABC (SANS 1418)", kind: overhead, role: feeder, material: Al, area_mm2: 70, r_ohm_per_km: 0.55, x_ohm_per_km: 0.083, neutral_r_ohm_per_km: 0.55, rating_a: 180, k: 94, fuse_a: 160, mass_kg_per_m: 1.02, diameter_mm: 35, uts_kn: 39.2, e_gpa: 56, alpha_per_c: 2.3e-5, clause: "SANS1418-1; idx C-01", status: unverified }
  - { code: ABC-95, description: "4 x 95 mm² Al ABC (SANS 1418)", kind: overhead, role: feeder, material: Al, area_mm2: 95, r_ohm_per_km: 0.40, x_ohm_per_km: 0.081, neutral_r_ohm_per_km: 0.40, rating_a: 220, k: 94, fuse_a: 200, mass_kg_per_m: 1.36, diameter_mm: 40, uts_kn: 53.2, e_gpa: 56, alpha_per_c: 2.3e-5, clause: "SANS1418-1; idx C-01", status: unverified }
  - { code: CU-PVC-16, description: "16 mm² 4-core Cu PVC SWA (SANS 1507-4)", kind: underground, role: feeder, material: Cu, area_mm2: 16, r_ohm_per_km: 1.38, x_ohm_per_km: 0.083, neutral_r_ohm_per_km: 1.38, rating_a: 84, k: 115, fuse_a: 63, clause: "SANS1507-4; idx C-02", status: unverified }
  - { code: CU-PVC-25, description: "25 mm² 4-core Cu PVC SWA (SANS 1507-4)", kind: underground, role: feeder, material: Cu, area_mm2: 25, r_ohm_per_km: 0.870, x_ohm_per_km: 0.081, neutral_r_ohm_per_km: 0.870, rating_a: 110, k: 115, fuse_a: 80, clause: "SANS1507-4; idx C-02", status: unverified }
  - { code: CU-PVC-35, description: "35 mm² 4-core Cu PVC SWA (SANS 1507-4)", kind: underground, role: feeder, material: Cu, area_mm2: 35, r_ohm_per_km: 0.627, x_ohm_per_km: 0.080, neutral_r_ohm_per_km: 0.627, rating_a: 130, k: 115, fuse_a: 100, clause: "SANS1507-4; idx C-02", status: unverified }
  - { code: CU-PVC-50, description: "50 mm² 4-core Cu PVC SWA (SANS 1507-4)", kind: underground, role: feeder, material: Cu, area_mm2: 50, r_ohm_per_km: 0.463, x_ohm_per_km: 0.078, neutral_r_ohm_per_km: 0.463, rating_a: 155, k: 115, fuse_a: 125, clause: "SANS1507-4; idx C-02", status: unverified }
  - { code: CU-PVC-70, description: "70 mm² 4-core Cu PVC SWA (SANS 1507-4)", kind: underground, role: feeder, material: Cu, area_mm2: 70, r_ohm_per_km: 0.321, x_ohm_per_km: 0.077, neutral_r_ohm_per_km: 0.321, rating_a: 190, k: 115, fuse_a: 160, clause: "SANS1507-4; idx C-02", status: unverified }
  - { code: CU-PVC-95, description: "95 mm² 4-core Cu PVC SWA (SANS 1507-4)", kind: underground, role: feeder, material: Cu, area_mm2: 95, r_ohm_per_km: 0.232, x_ohm_per_km: 0.076, neutral_r_ohm_per_km: 0.232, rating_a: 225, k: 115, fuse_a: 200, clause: "SANS1507-4; idx C-02", status: unverified }
  - { code: CU-PVC-120, description: "120 mm² 4-core Cu PVC SWA (SANS 1507-4)", kind: underground, role: feeder, material: Cu, area_mm2: 120, r_ohm_per_km: 0.184, x_ohm_per_km: 0.075, neutral_r_ohm_per_km: 0.184, rating_a: 255, k: 115, fuse_a: 200, clause: "SANS1507-4; idx C-02", status: unverified }
  - { code: CU-PVC-150, description: "150 mm² 4-core Cu PVC SWA (SANS 1507-4)", kind: underground, role: feeder, material: Cu, area_mm2: 150, r_ohm_per_km: 0.150, x_ohm_per_km: 0.075, neutral_r_ohm_per_km: 0.150, rating_a: 285, k: 115, fuse_a: 250, clause: "SANS1507-4; idx C-02", status: unverified }
  - { code: CU-PVC-185, description: "185 mm² 4-core Cu PVC SWA (SANS 1507-4)", kind: underground, role: feeder, material: Cu, area_mm2: 185, r_ohm_per_km: 0.120, x_ohm_per_km: 0.074, neutral_r_ohm_per_km: 0.120, rating_a: 320, k: 115, fuse_a: 315, clause: "SANS1507-4; idx C-02", status: unverified }
  - { code: SC-10CU, description: "10 mm² Cu concentric service cable", kind: overhead, role: service, material: Cu, area_mm2: 10, r_ohm_per_km: 2.20, x_ohm_per_km: 0.090, neutral_r_ohm_per_km: 2.20, rating_a: 60, k: 115, clause: "NRS034-1 service connections; idx C-03", status: unverified }
  - { code: SC-16CU, description: "16 mm² Cu concentric service cable", kind: overhead, role: service, material: Cu, area_mm2: 16, r_ohm_per_km: 1.38, x_ohm_per_km: 0.088, neutral_r_ohm_per_km: 1.38, rating_a: 80, k: 115, clause: "NRS034-1 service connections; idx C-03", status: unverified }
  - { code: SC-25CU, description: "25 mm² Cu concentric service cable", kind: overhead, role: service, material: Cu, area_mm2: 25, r_ohm_per_km: 0.870, x_ohm_per_km: 0.085, neutral_r_ohm_per_km: 0.870, rating_a: 105, k: 115, clause: "NRS034-1 service connections; idx C-03", status: unverified }

overhead:
  clause: "SANS10280-1 (clearances, loading), SANS754 (wood poles); idx OH-01"
  status: unverified
  max_span_m: 40
  min_ground_clearance_m: 5.0
  min_road_clearance_m: 5.5
  attachment_below_top_m: 0.3
  # Sag/tension: ruling-span change of state. Cases are temperature (°C) and wind pressure on the projected area (Pa).
  everyday: { temp_c: 15, wind_pa: 0, max_pct_uts: 18 }
  max_load: { temp_c: -5, wind_pa: 500, max_pct_uts: 50 }
  max_sag: { temp_c: 50, wind_pa: 0 }
  stay_angle_deg: 10         # deviations above this need a stay
  poles:                     # planting depth = 10 % of length + 0.6 m
    - { code: WP-7-140, length_m: 7, top_diameter_mm: 140, max_tip_load_kn: 3.0 }
    - { code: WP-9-160, length_m: 9, top_diameter_mm: 160, max_tip_load_kn: 4.5 }
    - { code: WP-9-180, length_m: 9, top_diameter_mm: 180, max_tip_load_kn: 6.5 }
    - { code: WP-11-180, length_m: 11, top_diameter_mm: 180, max_tip_load_kn: 6.0 }
  stay_capacity_kn: 25

underground:
  clause: "SANS10198-4 / SANS1507-4 derating; idx UG-01"
  status: unverified
  design: { depth_m: 0.8, soil_resistivity_kmw: 1.2, ground_temp_c: 25, circuits_in_trench: 1 }
  soil_resistivity_factor: { "0.8": 1.09, "1.0": 1.04, "1.2": 1.0, "1.5": 0.93, "2.0": 0.84, "2.5": 0.77, "3.0": 0.71 }
  depth_factor: { "0.5": 1.03, "0.8": 1.0, "1.0": 0.98, "1.25": 0.96, "1.5": 0.95 }
  ground_temp_factor: { "15": 1.11, "20": 1.05, "25": 1.0, "30": 0.94, "35": 0.88, "40": 0.82 }
  grouping_factor: { "1": 1.0, "2": 0.80, "3": 0.69, "4": 0.62, "5": 0.57, "6": 0.54 }

fault:
  clause: "IEC60909-0 (method), NRS034-1 protection grading; idx F-01"
  status: unverified
  mv_fault_mva: 250           # used until the authority gives the connection point fault level (plan 4.1)
  voltage_factor_max: 1.05    # IEC 60909 c for LV, maximum fault
  voltage_factor_min: 0.95    # IEC 60909 c for LV, minimum fault
  contact_resistance_ohm: 0.0
  min_fault_multiple_of_fuse: 4.0   # end-of-feeder phase-neutral fault must clear the feeder fuse quickly
  max_lv_terminal_fault_ka: 25
  transformers:               # rating kVA -> impedance %
    - { kva: 50, z_pct: 4.0, x_r: 1.5 }
    - { kva: 100, z_pct: 4.0, x_r: 2.0 }
    - { kva: 200, z_pct: 4.5, x_r: 3.0 }
    - { kva: 315, z_pct: 4.5, x_r: 3.5 }
    - { kva: 500, z_pct: 5.0, x_r: 4.5 }
