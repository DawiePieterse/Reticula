    classes:
      - { code: rural_settlement, description: Rural settlement, lsm: "LSM 1 (low end)", income_min_zar: 0, income_max_zar: 600, alpha: 0.30, beta: 2.98, c_amps: 20, admd_kva: 0.42, mean_a: 1.83, sd_a: 2.78 }
      - { code: rural_village, description: Rural village, lsm: "LSM 1 and 2", income_min_zar: 400, income_max_zar: 900, alpha: 0.43, beta: 2.52, c_amps: 20, admd_kva: 0.67, mean_a: 2.91, sd_a: 3.55 }
      - { code: informal_settlement, description: Informal settlement, lsm: "LSM 3 and 4", income_min_zar: 800, income_max_zar: 1500, alpha: 0.77, beta: 9.88, c_amps: 60, admd_kva: 1.00, mean_a: 4.35, sd_a: 4.56 }
      - { code: township_area, description: Township area, lsm: "LSM 5 and 6", income_min_zar: 1500, income_max_zar: 3000, alpha: 1.05, beta: 7.81, c_amps: 60, admd_kva: 1.64, mean_a: 7.13, sd_a: 6.18 }
      - { code: urban_residential_1, description: Urban residential I, lsm: "LSM 7", income_min_zar: 3000, income_max_zar: 5500, alpha: 1.23, beta: 5.56, c_amps: 60, admd_kva: 2.50, mean_a: 10.87, sd_a: 8.28 }
