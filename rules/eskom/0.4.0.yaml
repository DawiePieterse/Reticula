# Eskom residential distribution rules – MV network (plan Phase 3). STARTER VALUES.
# Inherits load data, LV design, conductor library and fault rules from eskom/0.3.0.
# Values marked `status: unverified` are typical figures to be checked against the standards in
# docs/standards-index.md before a design is submitted.
base: eskom/0.3.0
authority: eskom
version: 0.4.0
effective_date: 2026-10-04
notes: >-
  Adds the MV design section: transformer placement and sizing (SANS 780 pole-mount, SANS 1029 mini-subs), pole-mount
  or mini-sub selection, MV conductors (ACSR overhead, 11 kV XLPE cable), MV voltage-drop limit and off-load tap
  selection against the NRS 048-2 supply voltage band. Values are typical pending verification.

standards:
  NRS034-1: "2024"      # TODO confirm edition
  NRS048-2: "2024"      # TODO confirm edition
  SANS1418-1: "2024"    # TODO confirm edition
  SANS1507-4: "2024"    # TODO confirm edition
  SANS10198-4: "2024"   # TODO confirm edition
  SANS10280-1: "2024"   # TODO confirm edition
  SANS754: "2024"       # TODO confirm edition
  SANS780: "2024"       # TODO confirm edition
  SANS1029: "2024"      # TODO confirm edition
  SANS97: "2024"        # TODO confirm edition
  SANS182: "2024"       # TODO confirm edition
  IEC60909-0: "2016"    # TODO confirm edition

mv_design:
  clause: "NRS034-1 MV design; NRS048-2 supply voltage; idx MV-01"
  status: unverified
  nominal_kv: 11
  sending_voltage_pct: 100        # MV voltage at the connection point, % of nominal (authority input in plan 4.1)
  max_drop_pct: 5.0               # MV feeder drop, connection point to the furthest transformer
  power_factor: 0.95
  supply_voltage_band_pct: 10     # NRS 048-2: LV supply within ±10 % of nominal at the point of supply
  growth_allowance_pct: 0         # the NRS 034 15-year table already includes growth
  max_utilisation_pct: 100        # transformer design demand / rating
  max_lv_reach_m: 600             # a building is served by a site within this distance along the LV routes
  max_tee_m: 150                  # a site joins the nearest MV route within this distance
  taps_pct: [-5, -2.5, 0, 2.5, 5] # off-load tap boosts available on distribution transformers
  pole_mount_max_kva: 200         # larger ratings, or underground LV, use a mini-sub
  pole_mount:                     # SANS 780: rating kVA, impedance %, X/R
    - { kva: 50, z_pct: 4.0, x_r: 1.5 }
    - { kva: 100, z_pct: 4.0, x_r: 2.0 }
    - { kva: 200, z_pct: 4.5, x_r: 3.0 }
  minisub:                        # SANS 1029
    - { kva: 200, z_pct: 4.5, x_r: 3.0 }
    - { kva: 315, z_pct: 4.5, x_r: 3.5 }
    - { kva: 500, z_pct: 5.0, x_r: 4.5 }
    - { kva: 630, z_pct: 5.0, x_r: 5.0 }
    - { kva: 1000, z_pct: 6.0, x_r: 6.0 }
  mv_conductors:
    overhead: [MV-SQUIRREL, MV-FOX, MV-MINK, MV-HARE]
    underground: [MV-XLPE-35, MV-XLPE-70, MV-XLPE-95, MV-XLPE-185]

