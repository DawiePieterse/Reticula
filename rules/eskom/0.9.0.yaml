# Eskom residential distribution rules: 0.8.1 plus the LV drop limits, LV feeder fuses, overhead Airdac services and
# supplier impedances for the LV cables. Only the keys below differ from the base file (the conductor list is replaced
# whole). Every value must be checked before use in a design.
base: eskom/0.8.1
authority: eskom
version: 0.9.0
effective_date: 2026-10-07
notes: >-
  As 0.8.1, with the engineer's answers of 2026-10-07. The LV voltage drop limit is 8 % from the LV board to the
  customer, service cable included (CSIR Red Book ch. 12.1; the engineer gives 8 to 10 % from Eskom tenders; Eskom
  240-70465489 is still not held), with under 2 % in the service cable. Each LV feeder has an NH gG fuse chosen by an
  engineering assumption, and its far end must see a fault current of at least three times the fuse rating. Overhead
  houses are served by Airdac SNE 10 or 16 mm² in spans of at most 50 m, with a 7 m service pole where the sag would
  break the clearance. Underground LV cables get manufacturer impedances at 70 °C (CBi, with Voltex/Aberdare where it
  publishes them, averaged). Three-phase ABC ratings are the mean of three SANS 1418 suppliers, still placeholders.

standards:
  ENERGEX3064638: "Release 5 (2024-12-19)"   # Energex Standard for Pole Transformer Fusing: the 3 × fuse rating rule
  IEC60269-2: "2013"                          # TODO confirm edition: NH fuse links (gG)

# LV voltage drop (plans 2.4, 2.2). The limit is on the drop from the LV board to the customer's meter: the Herman-Beta
# drop at the service connection on the customer's phase, plus the service cable's drop at the customer's own
# (undiversified) demand.
voltage:
  lv_max_drop_pct: 8               # engineer 2026-10-07 (8–10 % in Eskom tenders); Red Book "approximately 8 %"
  lv_service_max_drop_pct: 2       # PLACEHOLDER: Red Book "less than 2 %" in services near the feeder end, at undiversified ADMD
  clause: "CSIR Red Book ch. 12.1, Voltage drop: about 8 % on the LV distributor including service connections (9 % or a little more where the regulated busbar is close and the LDC follows the area's feeder), services under 2 % at the undiversified ADMD; engineer 2026-10-07: 8 to 10 % in Eskom tenders; Eskom 240-70465489 not held"
  index: ESKOM-VDROP
  placeholder: [lv_service_max_drop_pct, mv_max_drop_pct, lv_max_rise_pct]

# Overhead service reach (plan 2.2): a house connects to an LV pole within one 50 m span (engineer 2026-10-07).
lv_loads:
  clause: "Eskom LV service practice as described by the engineer 2026-10-05; overhead services in spans of at most 50 m (engineer 2026-10-07); three-phase limit a placeholder"
  max_service_m: 50

# LV feeder protection (plan 2.4). Engineering assumption, as the Eskom protection settings (240-57649065) are not
# held: one NH gG fuse link per feeder in the transformer's LV fuse box or the kiosk. The fuse is the smallest standard
# rating that carries the feeder's design current and is not above the rating of any conductor in the feeder
# (I_B ≤ I_n ≤ I_z), and the least phase-to-neutral fault on the feeder must be at least min_fault_multiple × I_n so
# that the fuse operates (Energex 3064638 §4: "greater than 3 times the LV fuse rating").
lv_design:
  protection:
    clause: "Engineering assumption (engineer 2026-10-07): NH gG fuse per LV feeder to IEC 60269-2, I_B ≤ I_n ≤ I_z; end-of-feeder fault at least 3 × I_n after Energex 3064638 Release 5 §4; Eskom 240-57649065 not held"
    index: RETICULA-LVPROT
    fuse_ratings_a: [63, 80, 100, 125, 160, 200, 250, 315, 400]   # IEC 60269-2 NH preferred ratings (NH00 to NH2)
    min_fault_multiple: 3
    placeholder: [fuse_ratings_a, min_fault_multiple]

# Services (plans 2.2, 2.5). Each service gets the smallest conductor of its list that carries the customer's own
# demand and keeps the service drop within voltage.lv_service_max_drop_pct. Overhead services are strung at the
# supplier's maximum working tension, so the sag is w·L²/(8·T) as in the supplier's installation table; where the low
# point of a span would be below min_clearance_m, or a span longer than max_span_m, 7 m service poles are added along
# the service at equal spacing until every span clears.
services:
  clause: "Overhead services in Airdac SNE, spans at most 50 m, a 7 m service pole where the sag is a problem (engineer 2026-10-07); attachment heights, clearance and three-phase and underground service conductors are engineering assumptions"
  index: RETICULA-SERVICE
  overhead:
    single_phase: [AIRDAC-SNE-10, AIRDAC-SNE-16]
    three_phase: [ABC-3C-25, ABC-3C-35]     # PLACEHOLDER
    max_span_m: 50
    pole_height_m: 7
    below_line_m: 0.6                        # PLACEHOLDER: service clamp below the LV line attachment on the feeder pole
    house_attachment_m: 3.5                  # PLACEHOLDER: service bracket on the house wall or fascia
    min_clearance_m: 3.0                     # PLACEHOLDER: over the stand, pedestrians only (SANS 10280-1 not held)
    tension_pct: 25                          # Aberdare Airdac: maximum working tension 25 % of the breaking load
  underground:
    single_phase: [CU-2C-16, CU-2C-25, CU-2C-35]   # PLACEHOLDER
    three_phase: [CU-4C-16, CU-4C-25, CU-4C-35]    # PLACEHOLDER
  placeholder: [overhead.three_phase, overhead.below_line_m, overhead.house_attachment_m, overhead.min_clearance_m,
                underground.single_phase, underground.three_phase]

# Airdac mechanical data (merged into the base file's table). Mass and diameter: Aberdare and Alvern agree; breaking
# load (UTS) and maximum working tension: Aberdare only. Area, modulus and expansion are for copper and are not used
# for services, which are strung to the supplier's table rather than by the state-change equation.
overhead:
  mechanical:
    AIRDAC-SNE-10: { mass_kg_per_km: 320, diameter_mm: 12.8, area_mm2: 27.5, breaking_load_kn: 3.6,  modulus_gpa: 110, expansion_per_c: 0.000017 }
    AIRDAC-SNE-16: { mass_kg_per_km: 485, diameter_mm: 14.5, area_mm2: 42,   breaking_load_kn: 5.76, modulus_gpa: 110, expansion_per_c: 0.000017 }

