<header>
  <a class="brand" routerLink="/">Reticula</a>
  @if (auth.isAuthenticated()) {
    <nav>
      <a routerLink="/projects" routerLinkActive="active">Projects</a>
      <a routerLink="/rates" routerLinkActive="active">Rates</a>
      <a routerLink="/system" routerLinkActive="active">System</a>
    </nav>
  }
  <span class="spacer"></span>
  <span class="status" [class.offline]="!connectivity.online()">{{ connectivity.online() ? 'Online' : 'Offline' }}</span>
  @if (pwa.canInstall()) {
    <button type="button" (click)="pwa.install()">Install app</button>
  }
  @if (auth.user(); as u) {
    <span class="user">{{ u.displayName }}</span>
    <button type="button" (click)="auth.logout()">Sign out</button>
  }
</header>
<main>
  <router-outlet />
</main>
