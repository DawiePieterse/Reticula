services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: reticula
      POSTGRES_USER: reticula
      POSTGRES_PASSWORD: reticula
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reticula"]
      interval: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reticula
      MINIO_ROOT_PASSWORD: reticula123
    ports: ["9000:9000", "9001:9001"]
    volumes: [storage:/data]

  calc:
    build: ../src/calc
    environment:
      RETICULA_RULES_DIR: /rules
    volumes: ["../rules:/rules:ro"]
    ports: ["8001:8001"]

  api:
    build: ../src/api
    depends_on:
      db: { condition: service_healthy }
      calc: { condition: service_started }
    environment:
      ConnectionStrings__Default: "Host=db;Database=reticula;Username=reticula;Password=reticula"
      Calc__BaseUrl: "http://calc:8001"
      Storage__Endpoint: "http://storage:9000"
    ports: ["5000:8080"]

volumes:
  dbdata:
  storage:
