services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: reticula
      POSTGRES_USER: reticula
      POSTGRES_PASSWORD: reticula
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reticula"]
      interval: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reticula
      MINIO_ROOT_PASSWORD: reticula123
    ports: ["9000:9000", "9001:9001"]
    volumes: [storage:/data]

  calc:
    build: ../src/calc
    environment:
      RETICULA_RULES_DIR: /rules
      # Basemap that offline map packs are cut from: a PMTiles URL, or a file under ./maps (see docs/operations.md).
      RETICULA_MAP_SOURCE: "${RETICULA_MAP_SOURCE:-}"
    volumes: ["../rules:/rules:ro", "./maps:/maps:ro"]
    ports: ["8001:8001"]

  api:
    build: ../src/api
    depends_on:
      db: { condition: service_healthy }
      calc: { condition: service_started }
    environment:
      ConnectionStrings__Default: "Host=db;Database=reticula;Username=reticula;Password=reticula"
      Calc__BaseUrl: "http://calc:8001"
      Storage__Endpoint: "http://storage:9000"
      Database__MigrateOnStartup: "true"
      # First start only: creates the engineer account when no users exist. Change before use.
      Bootstrap__EngineerEmail: "${RETICULA_ENGINEER_EMAIL:-engineer@reticula.local}"
      Bootstrap__EngineerPassword: "${RETICULA_ENGINEER_PASSWORD:?set RETICULA_ENGINEER_PASSWORD}"
      Bootstrap__EngineerName: "${RETICULA_ENGINEER_NAME:-Engineer}"
    ports: ["5000:8080"]

  # Daily database dump to the backups volume, verified with pg_restore --list, 30-day retention.
  backup-db:
    image: postgis/postgis:17-3.5
    depends_on:
      db: { condition: service_healthy }
    entrypoint: ["/backup/run-daily.sh", "/backup/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: reticula
      PGPASSWORD: reticula
      PGDATABASE: reticula
      BACKUP_DIR: /backups
      RETENTION_DAYS: "30"
    volumes: ["./backup:/backup:ro", "backups:/backups"]

  # Daily mirror of the object store (photos, documents) to the backups volume.
  backup-files:
    image: minio/mc:latest
    depends_on: [storage]
    entrypoint: ["/backup/run-daily.sh", "/backup/mirror-files.sh"]
    environment:
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: reticula
      S3_SECRET_KEY: reticula123
      S3_BUCKET: reticula
      BACKUP_DIR: /backups
    volumes: ["./backup:/backup:ro", "backups:/backups"]

volumes:
  dbdata:
  storage:
  # Mount or sync this volume off the host; a backup on the same disk is not a backup.
  backups:
