name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  calc:
    name: Calc service (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --frozen
        working-directory: src/calc
      - run: uv run ruff check src tests
        working-directory: src/calc
      - run: uv run pytest -q
        working-directory: src/calc

  api:
    name: API (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet restore
        working-directory: src/api
      - run: dotnet build --no-restore -warnaserror
        working-directory: src/api
      - run: dotnet test --no-build
        working-directory: src/api

  web:
    name: Web (Angular 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: src/web/package-lock.json }
      - run: npm ci
        working-directory: src/web
      - run: npx ng build
        working-directory: src/web
      - run: npx ng test
        working-directory: src/web
